AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Stock Radio - Backend Infrastructure

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
  LlmProvider:
    Type: String
    Default: groq
    AllowedValues: [groq, claude]
  TtsEngine:
    Type: String
    Default: standard
    AllowedValues: [standard, neural]
  AlphaVantageApiKey:
    Type: String
    NoEcho: true
    Default: ""
  FinnhubApiKey:
    Type: String
    NoEcho: true
    Default: ""
  AlertEmail:
    Type: String
    Default: ""
    Description: "CloudWatch alarm notification email"

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 512
    Tracing: Active
    Environment:
      Variables:
        ENV: !Ref Env
        AUDIO_BUCKET: !Ref AudioBucket
        USERS_TABLE: !Ref UsersTable
        WATCHLISTS_TABLE: !Ref WatchlistsTable
        RADIOS_TABLE: !Ref RadiosTable
        LLM_PROVIDER: !Ref LlmProvider
        TTS_ENGINE: !Ref TtsEngine
        GROQ_API_KEY: !Ref GroqApiKey
        ANTHROPIC_API_KEY: !Ref AnthropicApiKey
        ALPHA_VANTAGE_API_KEY: !Ref AlphaVantageApiKey
        FINNHUB_API_KEY: !Ref FinnhubApiKey
        FIREBASE_CREDENTIALS_PARAM: !Sub "/stock-radio/${Env}/firebase-credentials"

Resources:

  AudioBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "stock-radio-audio-${Env}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteFreeAudio
            Status: Enabled
            ExpirationInDays: 1
            TagFilters:
              - Key: plan
                Value: free
          - Id: DeleteStandardAudio
            Status: Enabled
            ExpirationInDays: 3
            TagFilters:
              - Key: plan
                Value: standard
          - Id: DeleteProAudio
            Status: Enabled
            ExpirationInDays: 7
            TagFilters:
              - Key: plan
                Value: pro
          - Id: DeleteSharedContext
            Status: Enabled
            Prefix: "shared/"
            ExpirationInDays: 3

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stock-radio-users-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  WatchlistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stock-radio-watchlists-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: stockCode
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: stockCode
          KeyType: RANGE

  RadiosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "stock-radio-radios-${Env}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: radioDate
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: radioDate
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RadioWorkerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "stock-radio-worker-${Env}"
      VisibilityTimeout: 360
      MessageRetentionPeriod: 3600

  RadioGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stock-radio-generator-${Env}"
      CodeUri: lambda/radio_generator/
      Handler: handler.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Environment:
        Variables:
          WORKER_QUEUE_URL: !Ref RadioWorkerQueue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref WatchlistsTable
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt RadioWorkerQueue.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${AudioBucket}/shared/*"
      Events:
        RadioGenerationSchedule:
          Type: Schedule
          Properties:
            Schedule: "cron(30 20 * * ? *)"
            Name: !Sub "stock-radio-generate-${Env}"
            Description: "Daily radio generation at 5:30 AM JST"

  RadioWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stock-radio-worker-${Env}"
      CodeUri: lambda/radio_generator/
      Handler: worker.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - S3FullAccessPolicy:
            BucketName: !Ref AudioBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RadiosTable
        - Statement:
            - Effect: Allow
              Action:
                - polly:SynthesizeSpeech
                - polly:DescribeVoices
              Resource: "*"
        - SQSPollerPolicy:
            QueueName: !GetAtt RadioWorkerQueue.QueueName
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt RadioWorkerQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 3

  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stock-radio-api-${Env}"
      CodeUri: lambda/api_handler/
      Handler: handler.lambda_handler
      Timeout: 30
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref WatchlistsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RadiosTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${AudioBucket}/*"
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY

  NotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stock-radio-notification-${Env}"
      CodeUri: lambda/notification/
      Handler: handler.lambda_handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref RadiosTable
        - Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/stock-radio/${Env}/firebase-credentials"
      Events:
        NotificationSchedule:
          Type: Schedule
          Properties:
            Schedule: "cron(0 22 * * ? *)"
            Name: !Sub "stock-radio-notify-${Env}"
            Description: "Push notification at 7:00 AM JST"

  CleanupFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "stock-radio-cleanup-${Env}"
      CodeUri: lambda/cleanup/
      Handler: handler.lambda_handler
      Timeout: 300
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RadiosTable
        - S3FullAccessPolicy:
            BucketName: !Ref AudioBucket
      Events:
        CleanupSchedule:
          Type: Schedule
          Properties:
            Schedule: "cron(0 21 * * ? *)"
            Name: !Sub "stock-radio-cleanup-${Env}"
            Description: "Cleanup expired files at 6:00 AM JST"

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "stock-radio-alerts-${Env}"
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  CoordinatorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "stock-radio-coordinator-errors-${Env}"
      AlarmDescription: "Coordinator Lambda had errors - radio generation may have failed"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RadioGeneratorFunction
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Statistic: Sum
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  WorkerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "stock-radio-worker-errors-${Env}"
      AlarmDescription: "Worker Lambda had 3+ errors in 1 hour - multiple users affected"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RadioWorkerFunction
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Statistic: Sum
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  NotificationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "stock-radio-notification-errors-${Env}"
      AlarmDescription: "Notification Lambda had errors - push notifications may not have been sent"
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref NotificationFunction
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Statistic: Sum
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "stock-radio-monthly-${Env}"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 10
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  ApiGatewayUrl:
    Description: "API endpoint URL - set this in iOS APIService.swift"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  AudioBucketName:
    Value: !Ref AudioBucket
  UsersTableName:
    Value: !Ref UsersTable
  RadioGeneratorArn:
    Value: !GetAtt RadioGeneratorFunction.Arn
