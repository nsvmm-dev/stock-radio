name: StockRadio
options:
  bundleIdPrefix: com.stockradio
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ja

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0

targets:
  StockRadio:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    resources:
      - GoogleService-Info.plist
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: GoogleMobileAds
        product: GoogleMobileAds
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Bull Cast
        CFBundleLocalizations:
          - ja
          - en
        CFBundleDevelopmentRegion: ja
        UIBackgroundModes:
          - audio
          - fetch
          - remote-notification
        # AdMobテスト用App ID(Googleが公開している固定値、アカウント不要で動作)。
        # 本番運用開始時に実際のAdMobアカウントで発行されたApp IDへ差し替える。
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: この識別子は、より関連性の高い広告を表示するために使用されます。
    entitlements:
      path: StockRadio.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockradio.app
        PRODUCT_NAME: StockRadio
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      storeKitConfiguration: Products.storekit
